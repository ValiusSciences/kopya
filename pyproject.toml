[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kopya"
version = "1.0.0"
description = "Expression-only single-cell copy-number-variation caller."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bulent Arman Aksoy", email = "arman@valiussciences.com" }]
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26,<2",  # pyucell requires numpy<2; keeps scanpy/anndata on their last numpy<2 releases
    "scipy>=1.11",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "anndata>=0.10",
    "scanpy>=1.10",
    "leidenalg>=0.10",
    "igraph>=0.11",
    "pyucell>=0.6",
    "ruptures>=1.1.9",
    "pyarrow>=15",
    "click>=8.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.7",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "matplotlib>=3.7",
]

[project.scripts]
kopya = "kopya.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/kopya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
