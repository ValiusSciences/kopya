[build-system]
requires = ["hatchling>=1.27"]  # >=1.27 for PEP 639 license expressions
build-backend = "hatchling.build"

[project]
# Distribution name is vendor-prefixed: plain `kopya` was taken on PyPI by an
# unrelated project. The import name and CLI stay `kopya`.
name = "valius-kopya"
# Single source of truth is __version__ in src/kopya/__init__.py; hatch reads
# it at build time (see [tool.hatch.version]). Bump it there, not here.
dynamic = ["version"]
description = "Expression-only single-cell copy-number-variation caller."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bulent Arman Aksoy", email = "arman@valiussciences.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "single-cell",
    "scRNA-seq",
    "copy-number",
    "CNV",
    "bioinformatics",
    "cancer",
    "genomics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.26,<2",  # pyucell requires numpy<2; keeps scanpy/anndata on their last numpy<2 releases
    "scipy>=1.11",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "anndata>=0.10",
    "scanpy>=1.10",
    "leidenalg>=0.10",
    "igraph>=0.11",
    "pyucell>=0.6",
    "ruptures>=1.1.9",
    "pyarrow>=15",
    "click>=8.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.7",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/ValiusSciences/kopya"
Repository = "https://github.com/ValiusSciences/kopya"
Issues = "https://github.com/ValiusSciences/kopya/issues"

[project.scripts]
kopya = "kopya.cli:cli"

[tool.hatch.version]
path = "src/kopya/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kopya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
