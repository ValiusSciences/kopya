name: kopya
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python >=3.11
  - numpy >=1.26,<2      # pyucell pins numpy<2; without the ceiling the solve pulls scanpy 1.12/fast-array-utils (numpy>=2)
  - scipy >=1.11
  - pandas >=2.2
  - scikit-learn >=1.4
  - anndata >=0.10
  - scanpy >=1.10
  - leidenalg >=0.10
  - python-igraph >=0.11
  - ruptures >=1.1.9
  - pyarrow >=15
  - click >=8.1
  - tqdm >=4.66
  - pyyaml >=6
  - pip
  - pip:
      - pyucell               # not in any conda channel; pip-only
      # Editable install of this package. `-e .` resolves against the directory
      # you run conda/mamba from, so create the env from the repo root:
      #     mamba env create -f envs/kopya.yaml
      - -e .
